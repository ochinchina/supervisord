[unix_http_server]
file=/tmp/supervisord.sock
chmod=0700

[supervisord]
logfile=supervisord.log
logfile_maxbytes=50MB
logfile_backups=10
loglevel=info
pidfile=/tmp/supervisord.pid
nodaemon=false
minfds=1024
minprocs=200

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisord.sock

[inet_http_server]
port=127.0.0.1:9001
username=kozo
password=kozo

[program:test-echo]
command=echo "Hello from test program"
process_name=%(program_name)s_%(process_num)02d
numprocs=1
autostart=false
autorestart=false
startsecs=1
startretries=3
exitcodes=0
stopsignal=TERM
stopwaitsecs=10
stopasgroup=true
killasgroup=true
redirect_stderr=false
stdout_logfile=/tmp/test-echo.log
stderr_logfile=/tmp/test-echo.err
stdout_logfile_maxbytes=50MB
stderr_logfile_maxbytes=50MB
directory=/tmp

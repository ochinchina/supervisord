---
name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27"
      - name: Download dependencies
        run: go mod download && go mod tidy
      - name: Build
        run: go build -v -x ./...
      - name: Test
        run: mkdir -p $(pwd)/.gotmp && export GOTMPDIR=$(pwd)/.gotmp && go test -v ./...
